# ============================================================
# Karatu SIS — Base Application Config
# ============================================================
# Profile-specific configuration lives in:
#   application-dev.yml    (local development)
#   application-prod.yml   (production / Supabase)
#   application-test.yml   (automated tests / Testcontainers)
# ============================================================

spring:
  application:
    name: ${karatu.product.name}

  # Active profile is controlled by the SPRING_PROFILES_ACTIVE
  # environment variable. Defaults to 'dev' for local development.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# ------------------------------------------------------------
# Actuator — health and info endpoints
# Detailed health requires authentication (configured per-profile).
# ------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# ------------------------------------------------------------
# Application info (visible at /actuator/info)
# ------------------------------------------------------------
info:
  app:
    name: ${karatu.product.name}
    description: Backend API

# ------------------------------------------------------------
# Product identity and security configuration
# ------------------------------------------------------------
karatu:
  product:
    name: ${KARATU_PRODUCT_NAME:Karatu SIS}
    slug: ${KARATU_PRODUCT_SLUG:karatu}
    root-domain: ${KARATU_ROOT_DOMAIN:}
  security:
    jwt:
      issuer: ${KARATU_JWT_ISSUER:karatu-sis}
      cookie:
        name: ${KARATU_REFRESH_COOKIE_NAME:karatu_refresh_token}
  cors:
    allowed-origins: ${KARATU_CORS_ALLOWED_ORIGINS:http://localhost:3000}

app:
  timezone: Africa/Accra
