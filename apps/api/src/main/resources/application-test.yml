# ============================================================
# CarePoint — Test Profile
# Active when: @ActiveProfiles("test") in test classes
# Database: Testcontainers provides a real PostgreSQL container.
#   The datasource URL/username/password are set automatically
#   by @ServiceConnection — no manual datasource config needed.
# ============================================================

# ------------------------------------------------------------
# Security / JWT
# ------------------------------------------------------------
jwt:
  secret: test-secret-must-be-long-enough-for-hs256-12345678901234567890
  expiration-ms: 3600000

# ------------------------------------------------------------
# JPA / Hibernate
# ddl-auto: validate — Flyway is the schema authority (same as other profiles).
# show-sql: true — useful during test development.
# ------------------------------------------------------------
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # ------------------------------------------------------------
  # Flyway — runs migrations on the Testcontainers PostgreSQL
  # This ensures integration tests run against a real, migrated schema.
  # ------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

# ------------------------------------------------------------
# Logging — verbose for test debugging
# ------------------------------------------------------------
logging:
  level:
    com.schoolmanagement: DEBUG
    org.flywaydb: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN

