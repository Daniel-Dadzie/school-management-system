# ============================================================
# CarePoint School Management System — Docker Compose
# Local development infrastructure
# ============================================================
#
# Usage:
#   docker-compose up -d          Start all services
#   docker-compose down           Stop all services
#   docker-compose down -v        Stop and remove volumes (wipes data)
#   docker-compose logs postgres  Tail PostgreSQL logs
#
# Prerequisites:
#   Docker Desktop must be running.
#   Copy .env.example to .env and set POSTGRES_PASSWORD.
# ============================================================

services:

  # ------------------------------------------------------------
  # PostgreSQL — Primary database
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: carepoint-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carepoint_dev}
      POSTGRES_USER: ${POSTGRES_USER:-carepoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carepoint} -d ${POSTGRES_DB:-carepoint_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - carepoint-network

  # ------------------------------------------------------------
  # Redis — Cache and session store (uncomment when required)
  # Enable when a concrete requirement is introduced.
  # ------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: carepoint-redis
  #   command: redis-server --appendonly yes
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s
  #   restart: unless-stopped
  #   networks:
  #     - carepoint-network

# ------------------------------------------------------------
# Named volumes — persist data across container restarts
# ------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  # redis_data:
  #   driver: local

# ------------------------------------------------------------
# Networks
# ------------------------------------------------------------
networks:
  carepoint-network:
    driver: bridge

